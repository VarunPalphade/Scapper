<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>LinkedIn Sales Navigator Scraper</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      #navbar {
        background: #333;
        color: #fff;
        padding: 10px;
        text-align: center;
      }
      #content {
        display: flex;
        flex: 1;
      }
      #webview-container {
        flex: 3;
        border-right: 1px solid #ccc;
      }
      #controls {
        flex: 1;
        padding: 10px;
        overflow-y: auto;
      }
      webview {
        width: 100%;
        height: 100%;
      }
      form > div {
        margin-bottom: 10px;
      }
      label {
        display: inline-block;
        width: 150px;
      }
      /* New styles for progress bar and log view */
      #progress-container {
        margin-bottom: 10px;
      }
      #progress-bar {
        width: 100%;
        height: 20px;
      }
      #progress-text {
        font-weight: bold;
        margin-left: 10px;
      }
      #log-view {
        height: 150px;
        overflow-y: auto;
        border: 1px solid #ccc;
        padding: 5px;
        background: #f1f1f1;
        font-family: monospace;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div id="navbar">
      <h1>Sales Navigator Scraper</h1>
    </div>
    <div id="content">
      <div id="webview-container">
        <!-- Note: Ensure you enable the webviewTag in your BrowserWindow webPreferences -->
        <webview
          id="salesNavigatorWebview"
          src="https://www.linkedin.com/sales/"
          webpreferences="nodeIntegration=no"
        ></webview>
      </div>
      <div id="controls">
        <h2>Scraper Options</h2>
        <!-- Progress Bar -->
        <div id="progress-container">
          <progress id="progress-bar" value="0" max="100"></progress>
          <span id="progress-text">0%</span>
        </div>
        <!-- Log View -->
        <div id="log-view"></div>
        <!-- Scraper Options Form -->
        <form id="scrapeForm">
          <div>
            <label for="startPage">Start Page:</label>
            <input type="number" id="startPage" value="1" />
          </div>
          <div>
            <label for="endPage">End Page:</label>
            <input type="number" id="endPage" value="1" />
          </div>
          <div>
            <label for="waitTimeBetweenPages">Wait Time Between Pages (s):</label>
            <input type="number" id="waitTimeBetweenPages" value="5" />
          </div>
          <div>
            <label for="waitAfterPageLoaded">Wait After Page Loaded (s):</label>
            <input type="number" id="waitAfterPageLoaded" value="3" />
          </div>
          <div>
            <label for="waitAfterScrollDown">Wait After Scroll Down (s):</label>
            <input type="number" id="waitAfterScrollDown" value="3" />
          </div>
          <div>
            <label for="saveFormat">Save Format:</label>
            <select id="saveFormat">
              <option value="csv">CSV</option>
              <option value="xlsx">XLSX</option>
            </select>
          </div>
          <div>
            <label for="headless">Headless Mode:</label>
            <input type="checkbox" id="headless" />
          </div>
          <div>
            <button type="submit">Start Scraping</button>
          </div>
        </form>
        <div id="result" style="margin-top: 20px; font-weight: bold;"></div>
      </div>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
